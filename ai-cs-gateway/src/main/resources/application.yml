server:
  port: 8080
spring:
  application:
    name: ai-cs-gateway
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848
        fail-fast: false
        enabled: false
      config:
        enabled: false
        import-check:
          enabled: false
        server-addr: localhost:8848
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
            allowed-methods: "*"
            allowed-headers: "*"
            allow-credentials: true
      routes:
        - id: websocket-route
          uri: ${GATEWAY_WS_URI:ws://localhost:8081}
          predicates:
            - Path=/ws/**
        - id: ai-agent-route
          uri: ${GATEWAY_AGENT_URI:http://localhost:8082}
          predicates:
            - Path=/ai/**
        - id: knowledge-route
          uri: ${GATEWAY_KNOWLEDGE_URI:http://localhost:8083}
          predicates:
            - Path=/knowledge/**
        - id: knowledge-api-route
          uri: ${GATEWAY_KNOWLEDGE_URI:http://localhost:8083}
          predicates:
            - Path=/api/rag/**,/api/image/**,/api/audio/**,/api/file/**,/api/prompt/**,/api/multimodal/**,/api/document/**,/api/knowledge-graph/**,/api/knowledge-enhanced/**,/api/multimodal-knowledge/**
        - id: base-service-route
          uri: ${GATEWAY_BASE_URI:http://localhost:8084}
          predicates:
            - Path=/customer/**,/session/**,/agent/**,/file/**,/files/**,/auth/**,/statistics/**,/system/**
        - id: workorder-route
          uri: ${GATEWAY_WORKORDER_URI:http://localhost:8085}
          predicates:
            - Path=/workorder/**
        - id: open-route
          uri: ${GATEWAY_OPEN_URI:http://localhost:8086}
          predicates:
            - Path=/open/**
        - id: ops-route
          uri: ${GATEWAY_OPS_URI:http://localhost:8087}
          predicates:
            - Path=/ops/**

ai:
  jwt:
    secret: ${JWT_SECRET:}
    expire-ms: 86400000
    visitor-expire-ms: 7200000

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,gateway
      base-path: /actuator
  endpoint:
    health:
      show-details: never
