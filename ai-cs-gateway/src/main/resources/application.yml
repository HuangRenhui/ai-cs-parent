server:
  port: 8080
  tomcat:
    max-http-request-header-size: 8192
    max-swallow-size: 1048576
spring:
  application:
    name: ai-cs-gateway
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      timeout: 3000ms
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848
        fail-fast: false
        enabled: false
      config:
        enabled: false
        import-check:
          enabled: false
        server-addr: localhost:8848
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
            allowed-methods: GET,POST,PUT,DELETE,OPTIONS,PATCH
            allowed-headers: Authorization,Content-Type,Accept,X-User-Id,X-Username,X-Token-Type,X-Request-ID
            allow-credentials: true
            max-age: 3600
      routes:
        # 登录单独限流，防撞库（须放在 base-service 宽路由之前）
        - id: auth-login-route
          uri: ${GATEWAY_BASE_URI:http://localhost:8084}
          predicates:
            - Path=/auth/login,/auth/login/platform,/auth/register
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 5
                redis-rate-limiter.burstCapacity: 10
                key-resolver: "#{@ipKeyResolver}"
        - id: websocket-route
          uri: ${GATEWAY_WS_URI:ws://localhost:8081}
          predicates:
            - Path=/ws/**
        - id: ai-agent-route
          uri: ${GATEWAY_AGENT_URI:http://localhost:8082}
          predicates:
            - Path=/ai/**
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 20
                redis-rate-limiter.burstCapacity: 40
                key-resolver: "#{@ipKeyResolver}"
        - id: knowledge-route
          uri: ${GATEWAY_KNOWLEDGE_URI:http://localhost:8083}
          predicates:
            - Path=/knowledge/**,/help-center/**
        # 头像上传属于 base-service（/file/avatar）。浏览器经 /api 前缀时会变成 /api/file/avatar，
        # 若不先拆开，会被下面的 knowledge /api/file/** 吃掉，存到知识库文件目录。
        - id: avatar-upload-route
          uri: ${GATEWAY_BASE_URI:http://localhost:8084}
          predicates:
            - Path=/api/file/avatar
          filters:
            - RewritePath=/api/file/avatar,/file/avatar
        - id: knowledge-api-route
          uri: ${GATEWAY_KNOWLEDGE_URI:http://localhost:8083}
          predicates:
            - Path=/api/rag/**,/api/image/**,/api/audio/**,/api/video/**,/api/file/**,/api/prompt/**,/api/multimodal/**,/api/document/**,/api/knowledge-graph/**,/api/knowledge-enhanced/**,/api/multimodal-knowledge/**
        - id: base-service-route
          uri: ${GATEWAY_BASE_URI:http://localhost:8084}
          predicates:
            - Path=/customer/**,/session/**,/agent/**,/file/**,/files/**,/auth/**,/statistics/**,/system/**,/report/**,/queue/**
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 30
                redis-rate-limiter.burstCapacity: 60
                key-resolver: "#{@ipKeyResolver}"
        - id: workorder-route
          uri: ${GATEWAY_WORKORDER_URI:http://localhost:8085}
          predicates:
            - Path=/workorder/**
        - id: open-route
          uri: ${GATEWAY_OPEN_URI:http://localhost:8086}
          predicates:
            - Path=/open/**,/onboarding/**
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 20
                redis-rate-limiter.burstCapacity: 40
                key-resolver: "#{@ipKeyResolver}"
        - id: ops-route
          uri: ${GATEWAY_OPS_URI:http://localhost:8087}
          predicates:
            - Path=/ops/**
        # Actuator 监控端点路由（添加安全保护）
        - id: actuator-route
          uri: ${GATEWAY_BASE_URI:http://localhost:8084}
          predicates:
            - Path=/actuator/**
          filters:
            - name: ActuatorSecurity

ai:
  jwt:
    secret: ${JWT_SECRET:}
    expire-ms: 86400000
    visitor-expire-ms: 7200000
  internal:
    token: ${INTERNAL_API_TOKEN:}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,gateway
      base-path: /actuator
  endpoint:
    health:
      show-details: never
  # 生产环境建议启用 Actuator 安全认证
  # security:
  #   enabled: true
