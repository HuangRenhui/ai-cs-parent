server:
  port: 8083
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 100MB
spring:
  application:
    name: ai-cs-knowledge
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848
        fail-fast: false
        enabled: false
      config:
        enabled: false
        import-check:
          enabled: false
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/ai_customer_service?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  # Redis配置
  redis:
    host: 127.0.0.1
    port: 6379
    password:
    database: 0
    lettuce:
      pool:
        max-active: 8
        max-idle: 8
        min-idle: 2
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
milvus:
  host: localhost
  port: 19530
  collection-name: cs_kb_faq
  top-k: 5
  score-threshold: 0.40
  dimension: 1024
# FAQ 向量化走 ai.embedding（Dashscope）。顶层 embedding.url 仅文档 RAG / 旧脚本参考，主路径不再调用 localhost:8000
embedding:
  url: http://127.0.0.1:8000/embedding
llm:
  url: http://127.0.0.1:8000/v1/chat/completions
  api-key: xxx
  model: qwen-7b
  temperature: 0.2
ai:
  llm:
    api-key: ${AI_LLM_API_KEY:}
    model: qwen-turbo
    url: https://dashscope.aliyuncs.com/api/v1/services/aigc/text-generation/generation
  embedding:
    model: text-embedding-v3
    dimension: 1024

# RAG私有化配置（LangChain4j + Ollama + Chroma）
rag:
  ollama:
    base-url: http://localhost:11434
    llm-model: qwen:7b
    embedding-model: nomic-embed-text
    rerank-model: bge-reranker:latest
    temperature: 0.1
  chroma:
    base-url: http://localhost:8000
    collection-name: private_knowledge_base
    persist-path: ./chroma-db
  split:
    chunk-size: 500
    chunk-overlap: 80
    # === 语义切片 ===
    semantic-split-enabled: true       # 启用语义切片（按段落/标题边界分割）
    semantic-separators: "\n\n,。,；;！!？?,.，"  # 语义分隔符
    # === 分层切片 ===
    hierarchical-split-enabled: true   # 启用分层切片（文档→段落→句子→词语）
    paragraph-max-length: 2000         # 段落最大长度（字符）
    sentence-max-length: 500           # 句子最大长度（字符）
    min-chunk-length: 50               # 最小分块长度（太短的丢弃）
  retrieve:
    top-k: 5
    rerank-top-k: 3
    min-score: 0.6                     # Rerank最低相关性阈值
    # === 召回过滤 ===
    vector-min-score: 0.5              # 向量检索最低相似度阈值（初筛）
    bm25-min-score: 0.3                # BM25关键词最低分数阈值
    max-recall-docs: 10                # 最大召回文档数量（控制上下文长度）
    # === 文档质量过滤 ===
    quality-filter-enabled: true       # 启用品质量过滤
    min-content-length: 20             # 文档内容最小长度
    max-duplicate-ratio: 0.8           # 最大重复率
    # === 上下文压缩 ===
    summary-compress-enabled: true     # 启用摘要压缩
    max-context-length: 4000           # 上下文最大长度（字符）
    compress-target-length: 2000       # 压缩目标长度（字符）
  chat-memory:
    # 对话记录过期时间，单位秒（7天）
    ttl: 604800
  # ===== Prompt 调试配置（六大策略） =====
  prompt:
    enabled: true                    # Prompt增强总开关
    debug-log: true                  # 是否打印完整Prompt到日志（调试用）
    # === 1. 角色限定 ===
    system-role: "Java后端工程师"      # 系统角色身份
    role-description: "你是一名经验丰富的Java后端工程师，精通Spring Boot、微服务架构、数据库设计和系统优化。"  # 角色描述
    role-domain: "Java后端开发、Spring生态、微服务、分布式系统"  # 专业领域
    # === 2. 格式约束 ===
    output-format: text              # 输出格式: text/json/table/bullet/strict
    strict-output: false             # 是否禁止多余话术
    table-columns: ""                # 表格列定义（output-format=table时生效）
    # json-schema:                   # JSON字段约束（output-format=json时生效）
    #   name: "名称"
    #   description: "描述"
    # === 3. CoT 思维链 ===
    cot-enabled: false               # 是否启用思维链逐步推理
    cot-instruction: "请一步步思考，先分析问题，再逐步推理，最后给出答案。"  # CoT推理指令
    # cot-steps:                     # 自定义推理步骤
    #   - 理解问题
    #   - 列出已知条件
    #   - 逐步推导
    #   - 给出答案
    # === 4. Few-shot 少样本 ===
    few-shot-enabled: false          # 是否启用少样本示例
    # few-shot-examples:             # 示例列表（问题和答案对）
    #   - question: "示例问题"
    #     answer: "示例答案"
    #     reasoning: "推理过程（可选）"
    # === 5. 边界约束 ===
    boundary-enabled: true           # 是否启用边界约束
    no-data-reply: "暂无相关数据，无法回答此问题。"  # 无数据时的兜底回复
    no-fabrication: true             # 是否禁止编造数据
    additional-constraints: ""       # 额外禁止行为
    # === 6. 上下文约束 ===
    context-window-size: 4000        # 上下文窗口大小（字符数）
    context-only-reply: true         # 是否限制仅基于上下文回答
    context-prefix: "【参考文档】"    # 上下文前缀标识
    system-prefix: "【系统指令】"     # 系统指令前缀
    user-prefix: "【用户问题】"       # 用户问题前缀
    # === 预设模板（选择后自动覆盖以上配置） ===
    # 可用预设: java-engineer / interviewer / json-output / cot-reasoning
    #          few-shot / strict-boundary / table-output / full-combo
    preset: ""                       # 预设模板名称，为空则使用上方自定义配置

# 临时上传文件存放目录
upload:
  temp-path: ./upload-tmp

# 文件管理配置（查看、下载、解压）
file:
  root-path: ./uploads  # 文件根存储路径
  decompress-path: ./uploads/decompressed  # 解压文件输出目录
  package-path: ./uploads/packages  # 批量打包临时目录
  max-download-size: 100  # 单个文件最大下载大小（MB）
  max-decompress-size: 500  # 压缩包最大解压大小（MB），防止Zip炸弹
  max-decompress-files: 1000  # 最大解压文件数量，防止Zip炸弹
  previewable-types: image/,audio/,video/,application/pdf  # 允许预览的文件MIME类型前缀
  allowed-archive-formats: zip,7z,tar,gz,bz2,tgz  # 允许解压的压缩格式
  enable-access-control: false  # 是否启用文件访问Token验证
  token-expire-seconds: 3600  # 文件访问Token过期时间（秒）
  chunk-size: 1048576  # 断点续传分片大小（字节，默认1MB）

# 图片处理配置
image:
  storage-path: ./uploads/images
  thumbnail-path: ./uploads/thumbnails
  max-file-size: 10  # 最大文件大小（MB）
  compress-threshold: 500  # 压缩阈值（KB），超过此大小自动压缩
  compress-quality: 0.7  # 压缩质量（0.0-1.0）
  thumbnail-width: 200  # 缩略图宽度（像素）
  thumbnail-height: 200  # 缩略图高度（像素）
  allowed-formats: jpg,jpeg,png,gif,webp,bmp  # 允许的图片格式
  # 图片向量化配置
  auto-vectorize: true  # 上传后自动向量化
  vector-collection: image_embeddings  # Chroma向量集合名称
  search-max-results: 5  # 语义搜索最大返回结果数
  search-min-score: 0.5  # 语义搜索最低相似度阈值
  # 对象存储与CDN配置（增强功能）
  cdn-domain: ""  # CDN加速域名，配置后图片访问使用CDN地址
  storage-type: local  # 对象存储类型: local/minio/oss/cos
  storage-endpoint: ""  # 对象存储Endpoint
  storage-access-key: ""  # 对象存储AccessKey
  storage-secret-key: ""  # 对象存储SecretKey
  storage-bucket: images  # 对象存储Bucket

# 音频处理配置
audio:
  storage-path: ./uploads/audios
  max-file-size: 50  # 最大文件大小（MB）
  compress-threshold: 5120  # 压缩阈值（KB），超过此大小自动压缩
  target-bitrate: 128  # 目标比特率（kbps）
  target-sample-rate: 44100  # 目标采样率（Hz）
  allowed-formats: mp3,wav,aac,flac,ogg,wma,m4a  # 允许的音频格式
  enable-waveform: true  # 是否启用波形图生成
  waveform-width: 800  # 波形图宽度（像素）
  waveform-height: 200  # 波形图高度（像素）
  # 音频向量化配置
  auto-vectorize: true  # 上传后自动向量化
  vector-collection: audio_embeddings  # Chroma向量集合名称
  search-max-results: 5  # 语义搜索最大返回结果数
  search-min-score: 0.5  # 语义搜索最低相似度阈值
  enable-transcription: false  # 是否启用音频转录（Whisper）增强向量化
  transcription-url: http://localhost:9000/transcribe  # 转录服务地址

# 多媒体增强功能配置
media-enhance:
  ocr:
    enabled: true  # 是否启用OCR文字识别
    type: local  # OCR类型: local/tesseract/remote
    remote-url: ""  # 远程OCR API地址
    remote-key: ""  # 远程OCR API密钥
  moderation:
    enabled: true  # 是否启用AI内容审核
    auto-moderate: false  # 上传后自动审核
    block-level: HIGH  # 自动拦截等级: SAFE/LOW/MEDIUM/HIGH/BLOCKED
    remote-url: ""  # 远程审核API地址
    remote-key: ""  # 远程审核API密钥
  tagging:
    enabled: true  # 是否启用智能标签
    auto-tag: true  # 上传后自动打标签
  asr:
    enabled: true  # 是否启用语音识别
    engine: whisper  # ASR引擎: whisper/azure/aliyun
    whisper-url: http://localhost:9000/asr  # Whisper服务地址
  deduplication:
    enabled: true  # 是否启用去重检测
    image-threshold: 10  # 图片相似度阈值（汉明距离）
    audio-threshold: 0.85  # 音频相似度阈值（余弦相似度）
  hotlink:
    enabled: false  # 是否启用防盗链
    token-expire: 3600  # Token过期时间（秒）
    referer-whitelist: localhost,127.0.0.1  # Referer白名单（逗号分隔）
  multimodal:
    enabled: true  # 是否启用多模态检索
    default-modalities: image,audio,text  # 默认检索模态

# 多模态知识库配置
multimodal-knowledge:
  enabled: true  # 是否启用多模态知识库
  vision-model:
    type: ollama  # 多模态大模型类型: ollama/openai/local
    model-name: llava:latest  # 视觉模型名称
    base-url: http://localhost:11434  # API地址
    api-key: ""  # API密钥
    max-tokens: 2048
    temperature: 0.1
  video:
    frame-interval: 5  # 视频帧提取间隔（秒）
    max-frames: 20  # 每次最多提取帧数
    frame-storage-path: ./uploads/video-frames  # 帧图片存储路径
    max-summary-length: 500
    analysis-model: llava:latest
  hybrid-search:
    text-weight: 1.0  # 文本检索权重
    image-weight: 0.8  # 图片检索权重
    audio-weight: 0.6  # 音频检索权重
    video-weight: 0.5  # 视频检索权重
    fusion-method: rrf  # 融合方法: rrf/weighted/linear
    rrf-k: 60  # RRF参数k

# 知识图谱配置
knowledge-graph:
  enabled: false  # 是否启用知识图谱（需要Neo4j等图数据库）
  database-type: neo4j  # 图数据库类型: neo4j/nebula
  neo4j:
    uri: bolt://localhost:7687
    username: neo4j
    password: password
    database: neo4j
  nebula:
    address: localhost:9669
    username: root
    password: nebula
    space: knowledge_graph
  build:
    auto-build: false  # 是否自动从文档构建图谱
    max-entities: 10000
    max-relations: 50000
    min-confidence: 0.6
  extraction:
    method: hybrid  # 抽取方式: rule/llm/hybrid
    llm-model: qwen:7b
    max-text-length: 2000
    relation-types: 包含,依赖,属于,等同于,引用,相关,前置,后置

# knife4j文档配置
knife4j:
  enable: true
  openapi:
    title: 私有化RAG知识库系统接口文档
    description: SpringBoot+LangChain4j+Ollama+Chroma
    email: xxx@xxx.com
    concat: developer
    version: 1.0.0
    terms-of-service-url: http://localhost:8083
    group:
      default:
        group-name: 默认分组
        api-rule: package
        api-rule-resources:
          - com.ai.cs.knowledge.controller