# ============================================
# AI 智能客服系统 - 配置模板
# 复制此文件为 application.yml 并修改对应配置
# ============================================

server:
  port: ${PORT:8080}

spring:
  application:
    name: ${SERVICE_NAME:ai-cs-service}
  
  # 数据源配置
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/ai_customer_service?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:your_password}
  
  # Redis 配置
  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}
    database: ${REDIS_DATABASE:0}
    timeout: 3000ms
    lettuce:
      pool:
        max-active: 8
        max-idle: 8
        min-idle: 0
        max-wait: -1ms

# MyBatis Plus 配置
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.ai.cs.**.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: delFlag
      logic-delete-value: 1
      logic-not-delete-value: 0

# LLM 配置（仅在 ai-cs-agent 模块使用）
llm:
  url: ${LLM_URL:http://127.0.0.1:8000/v1/chat/completions}
  api-key: ${LLM_API_KEY:xxx}
  model: ${LLM_MODEL:qwen-7b}
  temperature: ${LLM_TEMPERATURE:0.2}
  max-tokens: ${LLM_MAX_TOKENS:2048}

# Embedding 配置（仅在 ai-cs-knowledge 模块使用）
embedding:
  url: ${EMBEDDING_URL:http://127.0.0.1:8000/embedding}
  dimension: ${EMBEDDING_DIMENSION:768}

# Milvus 配置（仅在 ai-cs-knowledge 模块使用）
milvus:
  host: ${MILVUS_HOST:localhost}
  port: ${MILVUS_PORT:19530}
  collection-name: ${MILVUS_COLLECTION:faq_vectors}

# ===== RAG 私有化配置（LangChain4j + Ollama + Chroma）=====
rag:
  ollama:
    base-url: ${OLLAMA_URL:http://localhost:11434}
    llm-model: ${OLLAMA_LLM:qwen:7b}
    embedding-model: ${OLLAMA_EMBEDDING:nomic-embed-text}
    rerank-model: ${OLLAMA_RERANK:bge-reranker:latest}
    temperature: ${OLLAMA_TEMPERATURE:0.1}
  chroma:
    base-url: ${CHROMA_URL:http://localhost:8000}
    collection-name: private_knowledge_base
    persist-path: ./chroma-db
  split:
    chunk-size: 500
    chunk-overlap: 80
    # === 语义切片 ===
    semantic-split-enabled: true
    semantic-separators: "\n\n,。,；;！!？?,.，"
    # === 分层切片 ===
    hierarchical-split-enabled: true
    paragraph-max-length: 2000
    sentence-max-length: 500
    min-chunk-length: 50
  retrieve:
    top-k: 5
    rerank-top-k: 3
    min-score: 0.6
    # === 召回过滤 ===
    vector-min-score: 0.5
    bm25-min-score: 0.3
    max-recall-docs: 10
    # === 文档质量过滤 ===
    quality-filter-enabled: true
    min-content-length: 20
    max-duplicate-ratio: 0.8
    # === 上下文压缩 ===
    summary-compress-enabled: true
    max-context-length: 4000
    compress-target-length: 2000
  chat-memory:
    ttl: 604800
  # ===== Prompt 调试配置（六大策略） =====
  prompt:
    enabled: true
    debug-log: ${PROMPT_DEBUG_LOG:false}
    # === 1. 角色限定 ===
    system-role: ${PROMPT_SYSTEM_ROLE:Java后端工程师}
    role-description: ${PROMPT_ROLE_DESC:你是一名经验丰富的Java后端工程师，精通Spring Boot、微服务架构、数据库设计和系统优化。}
    role-domain: ${PROMPT_ROLE_DOMAIN:Java后端开发、Spring生态、微服务、分布式系统}
    # === 2. 格式约束 ===
    output-format: ${PROMPT_OUTPUT_FORMAT:text}
    strict-output: ${PROMPT_STRICT_OUTPUT:false}
    # === 3. CoT 思维链 ===
    cot-enabled: ${PROMPT_COT_ENABLED:false}
    cot-instruction: ${PROMPT_COT_INSTRUCTION:请一步步思考，先分析问题，再逐步推理，最后给出答案。}
    # === 4. Few-shot 少样本 ===
    few-shot-enabled: ${PROMPT_FEWSHOT_ENABLED:false}
    # === 5. 边界约束 ===
    boundary-enabled: ${PROMPT_BOUNDARY_ENABLED:true}
    no-data-reply: ${PROMPT_NO_DATA_REPLY:暂无相关数据，无法回答此问题。}
    no-fabrication: ${PROMPT_NO_FABRICATION:true}
    # === 6. 上下文约束 ===
    context-window-size: ${PROMPT_CONTEXT_WINDOW:4000}
    context-only-reply: ${PROMPT_CONTEXT_ONLY:true}
    context-prefix: ${PROMPT_CONTEXT_PREFIX:【参考文档】}
    system-prefix: ${PROMPT_SYSTEM_PREFIX:【系统指令】}
    user-prefix: ${PROMPT_USER_PREFIX:【用户问题】}
    # === 预设模板 ===
    preset: ${PROMPT_PRESET:}

# 日志配置
logging:
  level:
    root: INFO
    com.ai.cs: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/${spring.application.name}.log
    max-size: 10MB
    max-history: 30

# Actuator 监控配置
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
