server:
  port: 8082
spring:
  application:
    name: ai-cs-agent
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848
        fail-fast: false
        enabled: false
      config:
        enabled: false
        import-check:
          enabled: false
    openfeign:
      circuitbreaker:
        enabled: true
      client:
        config:
          default:
            connectTimeout: 5000
            readTimeout: 35000
ai:
  jwt:
    secret: ${JWT_SECRET:}
  llm:
    api-key: ${AI_LLM_API_KEY:替换为你的通义API-KEY}
    api-secret: ${AI_LLM_API_SECRET:替换为你的通义API-SECRET}
    model: qwen-turbo
    url: https://dashscope.aliyuncs.com/api/v1/services/aigc/text-generation/generation
    timeout-seconds: 30
feign:
  open:
    url: ${FEIGN_OPEN_URL:http://localhost:8086}
  knowledge:
    url: ${FEIGN_KNOWLEDGE_URL:http://localhost:8083}
  workorder:
    url: ${FEIGN_WORKORDER_URL:http://localhost:8085}
  base-service:
    url: ${FEIGN_BASE_URL:http://localhost:8084}

resilience4j:
  timelimiter:
    configs:
      default:
        timeoutDuration: 40s
  circuitbreaker:
    configs:
      default:
        slidingWindowSize: 20
        failureRateThreshold: 50
        waitDurationInOpenState: 10s

knife4j:
  enable: true
  openapi:
    title: AI智能体服务接口文档
    description: AI对话、多模态对话、工具链编排
    version: 1.0.0
    group:
      default:
        group-name: AI智能体
        api-rule: package
        api-rule-resources:
          - com.ai.cs.aiagent.controller
