server:
  port: 8081
spring:
  application:
    name: ai-cs-websocket
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848
        fail-fast: false
        enabled: false
      config:
        enabled: false
        import-check:
          enabled: false
    openfeign:
      circuitbreaker:
        enabled: true
      client:
        config:
          default:
            connectTimeout: 5000
            readTimeout: 35000
  redis:
    host: localhost
    port: 6379
    password: ""
ai:
  jwt:
    secret: ${JWT_SECRET:}
feign:
  agent:
    url: ${FEIGN_AGENT_URL:http://localhost:8082}
  base-service:
    url: ${FEIGN_BASE_URL:http://localhost:8084}

resilience4j:
  timelimiter:
    configs:
      default:
        timeoutDuration: 40s
