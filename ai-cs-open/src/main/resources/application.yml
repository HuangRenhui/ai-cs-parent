server:
  port: 8086
spring:
  application:
    name: ai-cs-open
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848
        fail-fast: false
        enabled: false
      config:
        enabled: false
        import-check:
          enabled: false
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/ai_customer_service?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
ai:
  jwt:
    secret: ${JWT_SECRET:}
