server:
  port: 8086
spring:
  application:
    name: ai-cs-open
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848
        fail-fast: false
        enabled: false
      config:
        enabled: false
        import-check:
          enabled: false
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/ai_customer_service?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 30
      minimum-idle: 10
      connection-timeout: 3000
  # Redis配置（Spring Boot 3 的前缀是 spring.data.redis）：确认单状态推送走 ws:push 频道
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
open:
  tool:
    # 待确认记录有效期（分钟）：0 或负数表示不过期；超时判定在读列表/确认时惰性执行
    confirm-expire-minutes: ${OPEN_TOOL_CONFIRM_EXPIRE_MINUTES:30}
ai:
  jwt:
    secret: ${JWT_SECRET:}
  # 连接器 authJson / Webhook 凭据落库加密密钥（与 base-service 必须保持一致）
  model:
    secret: ${AI_MODEL_SECRET:}
